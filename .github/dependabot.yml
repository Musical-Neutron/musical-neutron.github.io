version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # prettier-plugin-astro 1.x formats .astro files for Astro 7's default
      # whitespace handling (compressHTML: 'jsx'). This site uses
      # compressHTML: true, and reformatting with 1.x changes the rendered
      # text (on the CWEBDWARFS site, "(CWEBDWARFS)" became "( CWEBDWARFS )").
      - dependency-name: prettier-plugin-astro
        update-types:
          - version-update:semver-major
    groups:
      # Astro and its official integrations must be upgraded together:
      # @astrojs/mdx and @astrojs/markdown-remark only accept a narrow range
      # of astro versions, so bumping one on its own breaks `npm ci`.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      astro-security:
        applies-to: security-updates
        patterns:
          - astro
          - '@astrojs/*'
      # Everything else: one PR per month for minor and patch releases.
      # Major releases still get their own PRs.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
