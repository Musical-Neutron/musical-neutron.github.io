# Settings for the site editor (Sveltia CMS, https://sveltiacms.app).
#
# To edit events, research, news posts or the announcement bar:
#   1. Run `npm run dev`.
#   2. Open http://localhost:4321/admin/index.html in Chrome or Edge.
#   3. Choose "Work with Local Repository" and select this repository's folder.
# Saving writes the changes straight into src/data/events.json, src/data/research.json,
# src/data/announcement.json or the post files in src/data/post/ (pictures for posts go in
# src/assets/images/news/).
# Nothing is committed or pushed: check the changes with `git diff` and commit them as usual.
#
# Events in the "outreach" category appear on the Outreach page.

backend:
  name: github
  repo: Musical-Neutron/musical-neutron.github.io
  branch: master

media_folder: public/images
public_folder: /images

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 2

collections:
  - name: data
    label: Site data
    files:
      - name: events
        label: Events
        file: src/data/events.json
        format: json
        fields:
          - name: events
            label: Events
            label_singular: Event
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.start_date}}: {{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - name: category
                label: Category
                widget: select
                default: outreach
                hint: "Only Outreach events appear on the site for now (the Outreach page and the home-page banner). Events in other categories are kept but not shown."
                options:
                  - { label: Conference, value: conference }
                  - { label: Seminar, value: seminar }
                  - { label: Outreach, value: outreach }
                  - { label: Milestone, value: milestone }
              - name: eventID
                label: Link name
                widget: string
                required: false
                hint: 'Optional. Lets other pages link straight to this event, e.g. "pint-of-science" for /outreach#pint-of-science.'
              - name: start_date
                label: Start date
                widget: datetime
                time_format: false
                format: YYYY-MM-DD
              - name: start_time
                label: Start time
                widget: datetime
                date_format: false
                format: "HH:mm"
                required: false
                hint: "Local time where the event happens. Leave empty for an all-day event."
              - name: end_date
                label: End date
                widget: datetime
                required: false
                time_format: false
                format: YYYY-MM-DD
                hint: "Leave empty if the event ends on the start date."
              - name: end_time
                label: End time
                widget: datetime
                date_format: false
                format: "HH:mm"
                required: false
              - name: timezone
                label: Time zone
                widget: select
                required: false
                hint: "Leave as (None) for UK time. Otherwise click and type a city to search, e.g. Madrid."
