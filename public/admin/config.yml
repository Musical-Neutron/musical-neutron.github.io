      - name: research
        label: Research
        file: src/data/research.json
        format: json
        fields:
          - name: topics
            label: Research topics
            label_singular: Topic
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Topics appear on the Research page and in the menu in this order. Drag to reorder."
            fields:
              - { name: title, label: Title, widget: string }
              - name: id
                label: Link name
                widget: string
                pattern:
                  [
                    "^[a-z0-9-]+$",
                    "Use lower-case letters, numbers and dashes only",
                  ]
                hint: "Used in links to this topic, e.g. /research#warm-dark-matter. Changing it breaks existing links to the topic."
              - name: menu_title
                label: Name in the menu
                widget: string
                required: false
                hint: "Leave empty to use the title."
              - name: icon
                label: Icon
                widget: select
                hint: "[See what the icons look like](icons)."
                options: *icon_options
              - { name: description, label: Description, widget: text }
              - name: menu_links
                label: Extra menu links
                label_singular: Link
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.text}}"
                hint: "Links shown under this topic in the menu, e.g. a project website."
                fields:
                  - { name: text, label: Text, widget: string }
                  - { name: href, label: Address, widget: string }
              - name: papers
                label: Papers
                label_singular: Paper
                widget: list
                collapsed: true
                summary: "{{fields.date}}: {{fields.citation}}"
                hint: "Shown newest first on the page, whatever the order here."
                fields:
                  - name: title
                    label: Title
                    widget: string
                    hint: "For italics or superscripts use <i>…</i> and <sup>…</sup>, e.g. <i>L</i><sup>*</sup>."
                  - name: citation
                    label: Citation
                    widget: string
                    hint: "e.g. Newton et al., 2025, MNRAS, 542(2), 591-607"
                  - name: date
                    label: Publication date
                    widget: datetime
                    time_format: false
                    format: YYYY-MM-DD
                    hint: "Used to put the papers in order."
                  - { name: summary, label: Summary, widget: text }
                  - name: links
                    label: Links
                    label_singular: Link
                    widget: list
                    required: false
                    summary: "{{fields.type}}: {{fields.href}}"
                    fields:
                      - name: type
                        label: Type
                        widget: select
                        default: journal
                        options:
                          - { label: "Journal", value: journal }
                          - { label: "arXiv", value: arxiv }
                          - { label: "ADS", value: ads }
                          - { label: "Zenodo", value: zenodo }
                          - { label: "GitHub", value: github }
                          - { label: "Other", value: other }
                      - { name: href, label: Address, widget: string }
                      - name: label
                        label: Link text
                        widget: string
                        required: false
                        hint: "Leave empty to use the type's name (Journal, arXiv, …)."
      - name: announcement
        label: Announcement bar
        file: src/data/announcement.json
        format: json
        fields:
          - name: enabled
            label: Show the bar
            widget: boolean
            default: false
            hint: "A strip across the top of every page, on tablets and computers (not on phones)."
          - name: badgeText
            label: Badge
            widget: string
            required: false
            default: NEW
            hint: "A short label before the text, such as NEW. Leave empty for no badge."
          - name: text
            label: Text
            widget: string
            required: false
          - name: link
            label: Link
            widget: string
            required: false
            hint: "Where the text links to: a page on this site, such as /outreach or /cv, or a full web address. Leave empty for no link."
          - name: expiresAt
            label: Hide after
            widget: datetime
            required: false
            output_utc: true
            hint: "The bar disappears at this time. Leave empty to keep it until you untick Show the bar."
  # News posts: one Markdown file each in src/data/post/, named by date and title
  # (e.g. 20260520-pint-of-science.md). Events can link to a post as their write-up.
  - name: posts
    label: News
    label_singular: News post
    folder: src/data/post
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    summary: "{{publishDate | date('YYYY-MM-DD')}}: {{title}}"
    sortable_fields: [publishDate, title]
    media_folder: /src/assets/images/news
    public_folder: ~/assets/images/news
    fields:
      - name: publishDate
        label: Date
        widget: datetime
        default: "{{now}}"
        output_utc: true
        hint: "Posts are listed newest first. A post less than 90 days old also appears on the home page."
      - {
          name: author,
          label: Author,
          widget: string,
          default: Oliver Newton,
          required: false,
        }
      - { name: title, label: Title, widget: string }
      - name: excerpt
        label: Summary
        widget: text
        required: false
        hint: "One or two sentences, shown in post lists and link previews."
      - { name: image, label: Image, widget: image, required: false }
      - name: category
        label: Category
        widget: relation
        collection: news_categories
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        dropdown_threshold: 0
        required: false
        hint: "Pick a category, or use Add Category for a new one. Each category gets its own page."
      - name: tags
        label: Tags
        widget: relation
        collection: news_tags
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        dropdown_threshold: 0
        required: false
        hint: "Pick tags already in use, or use Add Tag for a new one. Each tag gets its own page."
      - name: isJobMove
        label: Job move
        widget: boolean
        required: false
        hint: "For posts about starting a new position: without an image, the post shows the job-move picture instead of a plain placeholder."
      - name: draft
        label: Draft
        widget: boolean
        required: false
        hint: "Drafts are kept out of the site."
      - name: body
        label: Text
        widget: markdown
        hint: "Use the toolbar for formatting, or switch to Markdown to type it (HTML works there too)."
  # News tags: one small file per tag in src/data/tags, holding the tag's name. Posts store the file name, and the site
  # looks the name up here, so renaming or deleting a tag changes it on every post.
  - name: news_tags
    label: News tags
    label_singular: Tag
    description: "The tags offered when tagging a news post; new ones can also be added from a post. Renaming a tag here renames it on every post, and deleting it removes it from every post."
    folder: src/data/tags
    extension: json
    format: json
    create: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{name}}"
    sortable_fields: [name]
    fields:
      - name: name
        label: Tag
        widget: string
        pattern:
          [
            "^[a-z0-9]+(-[a-z0-9]+)*$",
            "Use lower-case letters and numbers, with hyphens between words.",
          ]
        unique: true
        hint: "Lower-case, with hyphens between words, e.g. local-group."
  # News categories, set up like the tags: one small file per category in src/data/categories, holding its name.
  - name: news_categories
    label: News categories
    label_singular: Category
    description: "The categories offered for a news post; new ones can also be added from a post. Renaming a category here renames it on every post, and deleting it removes it from every post."
    folder: src/data/categories
    extension: json
    format: json
    create: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{name}}"
    sortable_fields: [name]
    fields:
      - name: name
        label: Category
        widget: string
        unique: true
        hint: "As it should appear on the site, e.g. Outreach or Press."
